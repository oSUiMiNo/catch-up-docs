<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>オフライン</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0f1720;
        --fg: #e8eef5;
        --muted: #9fb0c3;
        --accent: #4da3ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fb;
          --fg: #16202b;
          --muted: #52657a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Hiragino Sans',
          'Noto Sans JP',
          sans-serif;
        font-size: 16px;
        line-height: 1.7;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        border-radius: 16px;
        border: 3px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>インターネット接続が必要です</h1>
      <p>
        文書はGitHubから毎回取得するため、オフラインでは閲覧できません。接続を確認してから、もう一度お試しください。
      </p>
    </main>
  </body>
</html>
