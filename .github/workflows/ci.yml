name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 既定を読み取りのみにする（SEC-006）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 整形チェック
        run: npm run format:check

      - name: 型検査
        run: npm run typecheck

      - name: 単体・統合テスト
        run: npm run test

      - name: production ビルド
        run: npm run build

      - name: 秘密情報スキャン
        # 文書リポジトリ名の混入も検査する。値はログへ出さない。
        env:
          PRIVATE_DOCS_REPO_NAME: ${{ secrets.PRIVATE_DOCS_REPO_NAME }}
        run: npm run verify:secrets

      - name: バンドルサイズ検査
        run: npm run check:bundle-size

      - name: ビルド成果物を共有
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: E2E（Chromium / WebKit）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: ブラウザを用意
        run: npx playwright install --with-deps chromium webkit

      - name: ビルド成果物を取得
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: E2E テスト
        run: npm run test:e2e

      - name: レポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: 依存の脆弱性確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # SEC-005：結果は確認するが、誤検知を考慮して high 以上のみを失敗条件とする。
      - name: npm audit
        run: npm audit --audit-level=high
